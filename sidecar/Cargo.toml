[package]
name = "solprobe-sidecar"
version = "0.1.0"
edition = "2021"
description = "GPU metrics sidecar for SolProbe — fault detection for distributed training"

[dependencies]
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
prometheus = "0.13"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
memmap2 = "0.9"
toml = "0.8"

[build-dependencies]
tonic-build = "0.12"
