[project]
name = "solprobe-backend"
version = "0.1.0"
description = "FastAPI backend for SolProbe — anomaly detection and alert management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "grpcio>=1.68",
    "grpcio-tools>=1.68",
    "protobuf>=5.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "websockets>=13.0",
    "prometheus-client>=0.21",
    "numpy>=1.26",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
