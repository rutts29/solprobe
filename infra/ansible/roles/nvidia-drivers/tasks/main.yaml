---
- name: Install prerequisites
  apt:
    name:
      - build-essential
      - dkms
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Download NVIDIA package repository GPG key (Ubuntu)
  get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    mode: "0644"
  when: ansible_os_family == "Debian"

- name: Add NVIDIA container toolkit repo with signed-by (Ubuntu)
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /"
    state: present
  when: ansible_os_family == "Debian"

- name: Install NVIDIA driver (Ubuntu)
  apt:
    name: nvidia-driver-535
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  notify: Reboot if needed

- name: Install NVIDIA driver (RHEL)
  yum:
    name: nvidia-driver-535-dkms
    state: present
  when: ansible_os_family == "RedHat"
  notify: Reboot if needed

- name: Install nvidia-container-toolkit
  apt:
    name: nvidia-container-toolkit
    state: present
  when: ansible_os_family == "Debian"

- name: Load nvidia kernel module
  modprobe:
    name: nvidia
    state: present
