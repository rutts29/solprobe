---
- name: Install prerequisites
  apt:
    name:
      - build-essential
      - dkms
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Add NVIDIA package repository key (Ubuntu)
  apt_key:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    state: present
  when: ansible_os_family == "Debian"

- name: Install NVIDIA driver (Ubuntu)
  apt:
    name: nvidia-driver-535
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  notify: Reboot if needed

- name: Install NVIDIA driver (RHEL)
  yum:
    name: nvidia-driver-latest-dkms
    state: present
  when: ansible_os_family == "RedHat"
  notify: Reboot if needed

- name: Install nvidia-container-toolkit
  apt:
    name: nvidia-container-toolkit
    state: present
  when: ansible_os_family == "Debian"

- name: Load nvidia kernel module
  modprobe:
    name: nvidia
    state: present

handlers:
  - name: Reboot if needed
    reboot:
      reboot_timeout: 300
    when: ansible_facts['kernel'] is defined
