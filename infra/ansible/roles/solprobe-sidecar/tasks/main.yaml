---
- name: Create solprobe user
  user:
    name: solprobe
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create sidecar directory
  file:
    path: /opt/solprobe
    state: directory
    owner: solprobe
    group: solprobe
    mode: "0755"

- name: Copy sidecar binary
  copy:
    src: solprobe-sidecar
    dest: /opt/solprobe/solprobe-sidecar
    owner: solprobe
    group: solprobe
    mode: "0755"
  notify: Restart solprobe-sidecar

- name: Deploy systemd service
  template:
    src: solprobe.service.j2
    dest: /etc/systemd/system/solprobe-sidecar.service
    mode: "0644"
  notify: Restart solprobe-sidecar

- name: Enable and start solprobe-sidecar service
  systemd:
    name: solprobe-sidecar
    enabled: true
    state: started
    daemon_reload: true

handlers:
  - name: Restart solprobe-sidecar
    systemd:
      name: solprobe-sidecar
      state: restarted
      daemon_reload: true
