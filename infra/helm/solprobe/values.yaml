global:
  namespace: solprobe

backend:
  # Keep a single backend pod until metrics, alerts, diagnoses, and websocket
  # clients move from process-local memory to shared external state.
  replicas: 1
  image: rutts29/solprobe-backend:v0.1.0
  port: 8000
  grpcPort: 50051
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  anthropicApiKeySecret: solprobe-secrets
  logLevel: info

sidecar:
  image: rutts29/solprobe-sidecar:v0.1.0
  metricsPort: 9100
  simulate: false
  mmap:
    # Training workloads on the same node must mount and write to this same
    # host path, otherwise the sidecar cannot read their mmap files.
    dir: /var/lib/solprobe/mmap
    hostPath: /var/lib/solprobe/mmap
    hostPathType: DirectoryOrCreate
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m
  nodeSelector:
    solprobe.io/gpu: "true"

dashboard:
  replicas: 1
  image: rutts29/solprobe-dashboard:v0.1.0
  port: 3000

ingress:
  enabled: true
  className: nginx
  host: solprobe.example.com
  annotations: {}
  tls:
    secretName: solprobe-tls

monitoring:
  prometheus:
    enabled: true
    scrapeInterval: 5s
  grafana:
    enabled: true
    storageSize: 1Gi
