apiVersion: v1
kind: ServiceAccount
metadata:
  name: solprobe-backend
  namespace: {{ include "solprobe.namespace" . }}
  labels:
    {{- include "solprobe.backend.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: solprobe-sidecar
  namespace: {{ include "solprobe.namespace" . }}
  labels:
    {{- include "solprobe.sidecar.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: solprobe-dashboard
  namespace: {{ include "solprobe.namespace" . }}
  labels:
    {{- include "solprobe.dashboard.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: {{ include "solprobe.namespace" . }}
  labels:
    app: grafana
    {{- include "solprobe.labels" . | nindent 4 }}
{{- if .Values.monitoring.prometheus.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ include "solprobe.namespace" . }}
  labels:
    app: prometheus
    {{- include "solprobe.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-reader
  namespace: {{ include "solprobe.namespace" . }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-reader
  namespace: {{ include "solprobe.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-reader
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ include "solprobe.namespace" . }}
{{- end }}
