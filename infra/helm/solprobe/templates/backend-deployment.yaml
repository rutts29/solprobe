apiVersion: apps/v1
kind: Deployment
metadata:
  name: solprobe-backend
  namespace: {{ include "solprobe.namespace" . }}
  labels:
    {{- include "solprobe.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: solprobe-backend
  template:
    metadata:
      labels:
        app: solprobe-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.backend.port }}"
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
            - name: grpc
              containerPort: {{ .Values.backend.grpcPort }}
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.anthropicApiKeySecret }}
                  key: ANTHROPIC_API_KEY
            - name: SOLPROBE_LOG_LEVEL
              value: {{ .Values.backend.logLevel | quote }}
            - name: SOLPROBE_METRICS_PORT
              value: {{ .Values.backend.port | quote }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
