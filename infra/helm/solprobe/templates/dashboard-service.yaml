apiVersion: v1
kind: Service
metadata:
  name: solprobe-dashboard
  namespace: {{ include "solprobe.namespace" . }}
  labels:
    {{- include "solprobe.dashboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: solprobe-dashboard
  ports:
    - name: http
      port: {{ .Values.dashboard.port }}
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solprobe-ingress
  namespace: {{ include "solprobe.namespace" . }}
  labels:
    {{- include "solprobe.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: solprobe-backend
                port:
                  number: {{ .Values.backend.port }}
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: solprobe-backend
                port:
                  number: {{ .Values.backend.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: solprobe-dashboard
                port:
                  number: {{ .Values.dashboard.port }}
{{- end }}
