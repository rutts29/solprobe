apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: solprobe-sidecar
  namespace: {{ include "solprobe.namespace" . }}
  labels:
    {{- include "solprobe.sidecar.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: solprobe-sidecar
  template:
    metadata:
      labels:
        app: solprobe-sidecar
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.sidecar.metricsPort }}"
    spec:
      serviceAccountName: solprobe-sidecar
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- if .Values.sidecar.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.sidecar.nodeSelector | nindent 8 }}
      {{- end }}
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sidecar
          image: {{ .Values.sidecar.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "--node-id"
            - "$(NODE_NAME)"
            - "--backend-addr"
            - "http://solprobe-backend:{{ .Values.backend.grpcPort }}"
            - "--mmap-dir"
            - "{{ .Values.sidecar.mmap.dir }}"
            {{- if .Values.sidecar.simulate }}
            - "--simulate"
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SOLPROBE_MMAP_DIR
              value: "{{ .Values.sidecar.mmap.dir }}"
          ports:
            - name: metrics
              containerPort: {{ .Values.sidecar.metricsPort }}
          resources:
            {{- toYaml .Values.sidecar.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: mmap-volume
              mountPath: {{ .Values.sidecar.mmap.dir }}
      volumes:
        - name: mmap-volume
          hostPath:
            path: {{ .Values.sidecar.mmap.hostPath }}
            type: {{ .Values.sidecar.mmap.hostPathType }}
