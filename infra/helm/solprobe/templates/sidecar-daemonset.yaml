apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: solprobe-sidecar
  namespace: {{ include "solprobe.namespace" . }}
  labels:
    {{- include "solprobe.sidecar.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: solprobe-sidecar
  template:
    metadata:
      labels:
        app: solprobe-sidecar
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.sidecar.metricsPort }}"
    spec:
      {{- if .Values.sidecar.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.sidecar.nodeSelector | nindent 8 }}
      {{- end }}
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sidecar
          image: {{ .Values.sidecar.image }}
          args:
            - "--node-id"
            - "$(NODE_NAME)"
            - "--backend-addr"
            - "http://solprobe-backend:{{ .Values.backend.grpcPort }}"
            {{- if .Values.sidecar.simulate }}
            - "--simulate"
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: {{ .Values.sidecar.metricsPort }}
          resources:
            {{- toYaml .Values.sidecar.resources | nindent 12 }}
          volumeMounts:
            - name: mmap-volume
              mountPath: /tmp
      volumes:
        - name: mmap-volume
          emptyDir: {}
