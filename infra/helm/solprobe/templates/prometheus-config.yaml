{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ include "solprobe.namespace" . }}
  labels:
    app: prometheus
    {{- include "solprobe.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}

    rule_files:
      - /etc/prometheus/alert_rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:
      - job_name: "sidecar"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["{{ include "solprobe.namespace" . }}"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: solprobe-sidecar
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2

      - job_name: "backend"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["{{ include "solprobe.namespace" . }}"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: solprobe-backend
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2

  alert_rules.yml: |
    groups:
      - name: solprobe-gpu
        rules:
          - alert: GPUTemperatureHigh
            expr: solprobe_gpu_temp > 85
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "GPU temperature above 85C on {{ "{{ $labels.node_id }}" }}"

          - alert: GPUMemoryHigh
            expr: solprobe_gpu_memory_used_pct > 95
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "GPU memory above 95% on {{ "{{ $labels.node_id }}" }}"

          - alert: GPUUtilizationLow
            expr: solprobe_gpu_utilization < 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "GPU utilization below 10% on {{ "{{ $labels.node_id }}" }}"
{{- end }}
