{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ include "solprobe.namespace" . }}
  labels:
    app: prometheus
    {{- include "solprobe.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}

    rule_files:
      - /etc/prometheus/alert_rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:
      - job_name: "sidecar"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["{{ include "solprobe.namespace" . }}"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: solprobe-sidecar
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2

      - job_name: "backend"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["{{ include "solprobe.namespace" . }}"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: solprobe-backend
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2
{{- end }}
