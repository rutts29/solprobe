apiVersion: apps/v1
kind: Deployment
metadata:
  name: solprobe-dashboard
  namespace: {{ include "solprobe.namespace" . }}
  labels:
    {{- include "solprobe.dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app: solprobe-dashboard
  template:
    metadata:
      labels:
        app: solprobe-dashboard
    spec:
      serviceAccountName: solprobe-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: dashboard
          image: {{ .Values.dashboard.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://solprobe-backend:{{ .Values.backend.port }}"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
