apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: solprobe
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ["alertname", "node_id"]
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: "webhook"
      routes:
        - match:
            severity: critical
          receiver: "webhook"
          continue: true

    receivers:
      - name: "webhook"
        webhook_configs:
          - url: "http://solprobe-backend:8000/api/v1/alerts/webhook"
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: "critical"
        target_match:
          severity: "warning"
        equal: ["alertname", "node_id"]
