apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: solprobe
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:
      - job_name: "sidecar"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["solprobe"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: solprobe-sidecar
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2

      - job_name: "backend"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["solprobe"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: solprobe-backend
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2

  alert_rules.yml: |
    groups:
      - name: solprobe-gpu
        rules:
          - alert: GPUTemperatureHigh
            expr: gpu_temperature_celsius > 85
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "GPU temperature above 85°C on {{ $labels.node_id }}"
              description: "GPU temperature is {{ $value }}°C"

          - alert: GPUMemoryHigh
            expr: (gpu_memory_used_bytes / gpu_memory_total_bytes) * 100 > 95
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "GPU memory above 95% on {{ $labels.node_id }}"
              description: "GPU memory usage is {{ $value }}%"

          - alert: GPUUtilizationLow
            expr: gpu_utilization_percent < 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "GPU utilization below 10% on {{ $labels.node_id }}"
              description: "GPU utilization is {{ $value }}%"
