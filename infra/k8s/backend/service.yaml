apiVersion: v1
kind: Service
metadata:
  name: solprobe-backend
  namespace: solprobe
  labels:
    app: solprobe-backend
spec:
  type: ClusterIP
  selector:
    app: solprobe-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: grpc
      port: 50051
      targetPort: grpc
