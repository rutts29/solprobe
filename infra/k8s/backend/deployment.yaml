apiVersion: apps/v1
kind: Deployment
metadata:
  name: solprobe-backend
  namespace: solprobe
  labels:
    app: solprobe-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: solprobe-backend
  template:
    metadata:
      labels:
        app: solprobe-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: backend
          image: rutts29/solprobe-backend:latest
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 50051
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: solprobe-secrets
                  key: ANTHROPIC_API_KEY
            - name: SOLPROBE_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: solprobe-backend-config
                  key: SOLPROBE_LOG_LEVEL
            - name: SOLPROBE_METRICS_PORT
              valueFrom:
                configMapKeyRef:
                  name: solprobe-backend-config
                  key: SOLPROBE_METRICS_PORT
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
