apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: solprobe-sidecar
  namespace: solprobe
  labels:
    app: solprobe-sidecar
spec:
  selector:
    matchLabels:
      app: solprobe-sidecar
  template:
    metadata:
      labels:
        app: solprobe-sidecar
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      serviceAccountName: solprobe-sidecar
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      nodeSelector:
        solprobe.io/gpu: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sidecar
          image: rutts29/solprobe-sidecar:v0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "--node-id"
            - "$(NODE_NAME)"
            - "--backend-addr"
            - "http://solprobe-backend:50051"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: mmap-volume
              mountPath: /tmp
      volumes:
        - name: mmap-volume
          emptyDir: {}
