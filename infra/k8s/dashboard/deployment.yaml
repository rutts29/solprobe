apiVersion: apps/v1
kind: Deployment
metadata:
  name: solprobe-dashboard
  namespace: solprobe
  labels:
    app: solprobe-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solprobe-dashboard
  template:
    metadata:
      labels:
        app: solprobe-dashboard
    spec:
      serviceAccountName: solprobe-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: dashboard
          image: rutts29/solprobe-dashboard:v0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://solprobe-backend:8000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
