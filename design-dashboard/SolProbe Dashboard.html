<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SolProbe — Cluster Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
<style>
  :root {
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    --radius: 8px;
    --radius-sm: 6px;
    --radius-lg: 12px;
    --row-h: 44px;
    --header-h: 56px;
    --sidebar-w: 220px;
  }

  /* DARK (default) */
  :root, [data-theme="dark"] {
    --bg: #0a0a0c;
    --bg-elev: #111114;
    --card: #111114;
    --card-2: #16161b;
    --border: #1f1f25;
    --border-strong: #2a2a32;
    --fg: #f4f4f5;
    --fg-muted: #a1a1aa;
    --fg-subtle: #71717a;
    --accent: oklch(0.72 0.18 38);
    --accent-soft: oklch(0.72 0.18 38 / 0.16);
    --accent-fg: #0a0a0f;
    --ok: oklch(0.74 0.15 162);
    --ok-soft: oklch(0.74 0.15 162 / 0.14);
    --warn: oklch(0.78 0.15 75);
    --warn-soft: oklch(0.78 0.15 75 / 0.16);
    --crit: oklch(0.68 0.20 22);
    --crit-soft: oklch(0.68 0.20 22 / 0.16);
    --info: oklch(0.72 0.13 235);
    --info-soft: oklch(0.72 0.13 235 / 0.14);
    --grid: rgba(255, 255, 255, 0.04);
    --hover: rgba(255, 255, 255, 0.03);
    --shadow: 0 1px 0 rgba(255,255,255,0.02) inset;
  }

  [data-theme="light"] {
    --bg: oklch(0.985 0.003 95);
    --bg-elev: #ffffff;
    --card: #ffffff;
    --card-2: oklch(0.975 0.004 95);
    --border: oklch(0.92 0.005 95);
    --border-strong: oklch(0.86 0.006 95);
    --fg: oklch(0.18 0.01 280);
    --fg-muted: oklch(0.45 0.01 280);
    --fg-subtle: oklch(0.58 0.01 280);
    --accent: oklch(0.65 0.20 38);
    --accent-soft: oklch(0.65 0.20 38 / 0.12);
    --accent-fg: #ffffff;
    --ok: oklch(0.55 0.14 162);
    --ok-soft: oklch(0.55 0.14 162 / 0.12);
    --warn: oklch(0.58 0.14 75);
    --warn-soft: oklch(0.58 0.14 75 / 0.14);
    --crit: oklch(0.55 0.20 22);
    --crit-soft: oklch(0.55 0.20 22 / 0.10);
    --info: oklch(0.55 0.14 235);
    --info-soft: oklch(0.55 0.14 235 / 0.10);
    --grid: rgba(0, 0, 0, 0.04);
    --hover: rgba(0, 0, 0, 0.025);
    --shadow: 0 1px 0 rgba(0,0,0,0.02);
  }

  [data-density="compact"] {
    --row-h: 36px;
    --header-h: 48px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'cv11', 'ss01';
  }
  .mono { font-family: var(--font-mono); font-feature-settings: 'zero', 'ss01'; }
  .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

  /* base utility */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .hairline { border-color: var(--border) !important; }

  /* tooltip */
  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--bg-elev); color: var(--fg);
    border: 1px solid var(--border-strong);
    padding: 4px 8px; border-radius: 6px; font-size: 11px;
    white-space: nowrap; z-index: 50; pointer-events: none;
    font-family: var(--font-mono);
  }

  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.85); }
  }
  .pulse-dot { animation: pulseDot 1.6s ease-in-out infinite; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .slide-in { animation: slideIn 0.25s ease-out; }

  @keyframes flash {
    0% { background: var(--accent-soft); }
    100% { background: transparent; }
  }
  .flash { animation: flash 1.2s ease-out; }
</style>
</head>
<body>
<div id="root"></div>
